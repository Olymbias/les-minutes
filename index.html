<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Minutes</title>
<meta name="description" content="Combien de temps te faudrait-il pour amasser la fortune d'un milliardaire ?">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#285C36">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --vert:#285C36;
  --vert-sombre:#1E4429;
  --creme:#F4EFE3;
  --creme-sourd:#C9D6C4;
  --or:#D9BA5F;
  --corail:#D97E6A;
  --rouge:#BF4F45;
  --bleu:#6B90BF;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;
  font-size:17px;
  line-height:1.5;
  background:var(--vert);
  color:var(--creme);
  padding:0 0 56px;
}
.affiche{max-width:560px;margin:0 auto;padding:0 20px}

/* --- En-tête --- */
header{padding-top:30px;position:relative}
.langue{
  position:absolute;top:26px;right:0;
  font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.12em;
  background:none;border:2px solid var(--creme);color:var(--creme);
  padding:6px 12px;cursor:pointer;
}
.langue:hover{background:var(--creme);color:var(--vert)}
.eyebrow{
  font-size:12px;font-weight:500;letter-spacing:.28em;
  text-transform:uppercase;color:var(--or);
}
h1{
  font-weight:700;
  font-size:clamp(46px,15vw,84px);
  line-height:.95;
  letter-spacing:-.02em;
  text-transform:uppercase;
  margin:14px 0 12px;
  color:var(--creme);
}
h1 .point{color:var(--corail)}
.soustitre{color:var(--creme-sourd);font-size:17px;max-width:40ch}

/* --- Formulaire --- */
.saisie{margin-top:30px}
label{
  display:block;
  font-size:12px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--or);margin-bottom:7px;
}
.ligne{display:flex;gap:10px}
input,select{
  font-family:inherit;font-size:18px;font-weight:500;
  color:var(--vert-sombre);background:var(--creme);
  border:none;border-radius:0;
  padding:14px 12px;width:100%;
}
.ligne input{flex:1.15}
.ligne select{flex:1}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--or);outline-offset:3px}
.champ+.champ{margin-top:18px}

/* --- Résultats --- */
.verdict{display:none}
.verdict.ouvert{display:block}
section{margin-top:34px;border-top:6px solid var(--or);padding-top:14px}
h2{
  font-size:13px;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--or);margin-bottom:12px;
}
.constat{font-size:19px;margin-bottom:10px}
.constat:last-child{margin-bottom:0}
.chiffre{font-weight:700;color:var(--corail);font-variant-numeric:tabular-nums}
.aparte{
  margin-top:14px;padding:10px 0 10px 14px;font-size:15.5px;
  color:var(--creme-sourd);border-left:4px solid var(--bleu);
}

/* --- Échelle --- */
.echelle{list-style:none}
.echelle li{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:11px 0;border-bottom:1px solid rgba(244,239,227,.22);
  font-size:17px;
}
.echelle li:last-child{border-bottom:none}
.echelle .cadence{text-transform:lowercase}
.echelle .duree{font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.echelle li.ultime{
  background:var(--rouge);color:var(--creme);
  padding:14px 12px;margin-top:10px;border-bottom:none;
}

/* --- Compteur --- */
.greffe{
  font-size:clamp(30px,9vw,44px);font-weight:700;
  color:var(--or);font-variant-numeric:tabular-nums;
  margin:8px 0 6px;word-break:break-word;line-height:1.1;
}
.glose{font-size:14px;color:var(--creme-sourd)}

/* --- Actions & sources --- */
.actions{margin-top:30px}
button.sceau{
  font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;background:var(--rouge);color:var(--creme);
  border:none;padding:15px 24px;cursor:pointer;width:100%;
}
button.sceau:hover{background:var(--corail)}
.sources{margin-top:26px;font-size:14px;color:var(--creme-sourd)}
.sources summary{
  cursor:pointer;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  font-size:12px;color:var(--creme-sourd);list-style:none;
}
.sources summary::before{content:"+ "}
.sources[open] summary::before{content:"− "}
.sources ul{list-style:none;margin-top:10px}
.sources li{padding:4px 0;border-bottom:1px solid rgba(244,239,227,.14)}
.sources li:last-child{border-bottom:none}

footer{
  margin-top:34px;padding-top:14px;border-top:1px solid rgba(244,239,227,.22);
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;line-height:1.85;color:var(--creme-sourd);
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="affiche">

<header>
  <button class="langue" id="langue" type="button">EN</button>
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="titre"></h1>
  <p class="soustitre" id="soustitre"></p>

  <div class="saisie">
    <div class="champ">
      <label for="salaire" id="lblSalaire"></label>
      <div class="ligne">
        <input type="number" id="salaire" inputmode="decimal" min="1" step="50" value="2000">
        <select id="periode">
          <option value="mois" selected></option>
          <option value="semaine"></option>
          <option value="an"></option>
        </select>
      </div>
    </div>
    <div class="champ">
      <label for="sujet" id="lblSujet"></label>
      <select id="sujet"></select>
    </div>
  </div>
</header>

<div class="verdict" id="verdict">

  <section>
    <h2 id="h2Constat"></h2>
    <p class="constat" id="constatAnnees"></p>
    <p class="constat" id="constatVies"></p>
    <div class="aparte" id="ancrage"></div>
  </section>

  <section>
    <h2 id="h2Echelle"></h2>
    <ul class="echelle" id="echelle"></ul>
  </section>

  <section>
    <h2 id="h2Greffe"></h2>
    <p id="greffeIntro"></p>
    <p class="greffe" id="greffe">0 €</p>
    <p class="glose" id="greffeGlose"></p>
  </section>

  <div class="actions">
    <button class="sceau" id="copier" type="button"></button>
  </div>

  <details class="sources">
    <summary id="srcTitre"></summary>
    <ul id="srcListe"></ul>
  </details>

</div>

<footer id="pied"></footer>
</div>

<script>
/* ============================================================
   1. LES DONNÉES
   Fortunes : Forbes. Chaque chiffre porte sa date de relevé,
   à mettre à jour à la main (voir LISEZ-MOI).
   ============================================================ */
const SUJETS = [
  { id:"musk",    famille:"Musk",    nom:"Elon Musk",       usd:830e9,  releve:"Forbes 2026" },
  { id:"page",    famille:"Page",    nom:"Larry Page",      usd:257e9,  releve:"Forbes 03/2026" },
  { id:"bezos",   famille:"Bezos",   nom:"Jeff Bezos",      usd:290e9,  releve:"Forbes 2026" },
  { id:"arnault", famille:"Arnault", nom:"Bernard Arnault", usd:160e9,  releve:"Forbes 2026" },
  { id:"bollore", famille:"Bolloré", nom:"Vincent Bolloré", usd:10.3e9, releve:"Forbes 04/2025" },
];
const TAUX_USD_EUR = 0.92;
const CARRIERE = 43;              // années d'une vie de travail
const SEMAINES_PAR_MOIS = 52.18/12;

/* ============================================================
   2. LES TEXTES — un objet par langue.
   Toute phrase affichée vit ici, jamais dans le HTML.
   ============================================================ */
const TEXTES = {
  fr: {
    htmlLang:"fr", autreLangue:"EN",
    titre:"Les Minutes",
    eyebrow:"Séance publique · Pièce nº 1",
    soustitre:"Doléances chiffrées, à l'usage de qui travaille pour vivre.",
    lblSalaire:"Ce que tu gagnes", lblSujet:"Celui qu'on examine",
    perMois:"€ / mois", perSemaine:"€ / semaine", perAn:"€ / an",
    h2Constat:"Constat", h2Echelle:"Échelle des cadences", h2Greffe:"Pendant ce temps",
    annees:(v)=>`Bonne nouvelle : plus que <span class="chiffre">${v}</span> à mettre de côté. Sans rien dépenser, évidemment.`,
    vies:(v)=>`Soit <span class="chiffre">${v}</span> vies entières de travail. Prévois du renfort.`,
    ancrage:(q,a)=>`Pour y être arrivé aujourd'hui, il aurait fallu commencer ${q}. ${a}`,
    cadences:["…chaque mois","…chaque semaine","…chaque jour","…chaque heure","…chaque minute","…chaque seconde"],
    greffeIntro:"Depuis que tu as ouvert cette page, il a gagné :",
    greffeGlose:"Estimation basée sur son revenu annuel Forbes 2026.",
    srcTitre:"Chiffres & sources",
    copier:"Copier le procès-verbal", copie:"Procès-verbal copié",
    pied:(d)=>`Fortunes : Forbes, converties en euros (1 $ ≈ ${d} €).<br>Carrière de référence : ${CARRIERE} ans.<br>Aucun montant saisi ne quitte cet appareil.`,
    ansPluriel:"ans", anMillions:"d'années", jours:"jours", heures:"heures", minutes:"minutes", secondes:"secondes",
    milliards:"milliards", millions:"millions", milliard:"milliard", million:"million",
    mdAbrege:"Md €",
    avantJC:(n)=>`en l'an ${n} avant notre ère`, apresJC:(n)=>`en ${n}`,
    ancres:[
      {min:66e6,  txt:"Les premiers primates n'existaient pas encore."},
      {min:3.2e6, txt:"Lucy, notre ancêtre commune, n'était pas née."},
      {min:300000,txt:"Avant les premiers Homo sapiens."},
      {min:40000, txt:"Avant les peintures de Lascaux."},
      {min:12000, txt:"Avant l'invention de l'agriculture."},
      {min:5000,  txt:"Avant la construction des pyramides de Gizeh."},
      {min:2000,  txt:"À l'époque de Jules César."},
      {min:1000,  txt:"Au temps des croisades."},
      {min:500,   txt:"Avant la découverte de l'Amérique."},
      {min:200,   txt:"Napoléon régnait encore."},
      {min:100,   txt:"Avant la Seconde Guerre mondiale."},
      {min:0,     txt:"C'est presque à portée. Presque."},
    ],
  },
  en: {
    htmlLang:"en", autreLangue:"FR",
    titre:"The Minutes",
    eyebrow:"Public session · Exhibit no. 1",
    soustitre:"Grievances, itemised, for those who work for a living.",
    lblSalaire:"What you earn", lblSujet:"The party under review",
    perMois:"€ / month", perSemaine:"€ / week", perAn:"€ / year",
    h2Constat:"The record", h2Echelle:"Schedule of rates", h2Greffe:"Meanwhile",
    annees:(v)=>`Good news: only <span class="chiffre">${v}</span> left to save. Spending nothing, naturally.`,
    vies:(v)=>`That is <span class="chiffre">${v}</span> full working lives. Bring friends.`,
    ancrage:(q,a)=>`To have got there by today, you'd have needed to start ${q}. ${a}`,
    cadences:["…every month","…every week","…every day","…every hour","…every minute","…every second"],
    greffeIntro:"Since you opened this page, he has earned:",
    greffeGlose:"Estimate based on his Forbes 2026 annual income.",
    srcTitre:"Figures & sources",
    copier:"Copy the minutes", copie:"Minutes copied",
    pied:(d)=>`Fortunes: Forbes, converted to euros (US$1 ≈ €${d}).<br>Reference career: ${CARRIERE} years.<br>Nothing you type leaves this device.`,
    ansPluriel:"years", anMillions:"years", jours:"days", heures:"hours", minutes:"minutes", secondes:"seconds",
    milliards:"billion", millions:"million", milliard:"billion", million:"million",
    mdAbrege:"bn €",
    avantJC:(n)=>`in the year ${n} BCE`, apresJC:(n)=>`in ${n}`,
    ancres:[
      {min:66e6,  txt:"The first primates didn't exist yet."},
      {min:3.2e6, txt:"Lucy, our common ancestor, wasn't born yet."},
      {min:300000,txt:"Before the first Homo sapiens."},
      {min:40000, txt:"Before the Lascaux cave paintings."},
      {min:12000, txt:"Before the invention of agriculture."},
      {min:5000,  txt:"Before the construction of the pyramids at Giza."},
      {min:2000,  txt:"In the time of Julius Caesar."},
      {min:1000,  txt:"During the Crusades."},
      {min:500,   txt:"Before the discovery of America."},
      {min:200,   txt:"Napoleon was still in power."},
      {min:100,   txt:"Before the Second World War."},
      {min:0,     txt:"Almost within reach. Almost."},
    ],
  },
};

/* ============================================================
   3. OUTILS
   ============================================================ */
let langue = "fr";
const T = () => TEXTES[langue];
const $ = (id) => document.getElementById(id);
const ANNEE = new Date().getFullYear();
const SECONDES_PAR_AN = 365.25 * 86400;

function nf(max){ return new Intl.NumberFormat(langue === "fr" ? "fr-FR" : "en-GB", {maximumFractionDigits:max}); }

function grandNombre(n){
  const t = T();
  const echelle = (valeur, pluriel, singulier) => {
    const texte = nf(1).format(valeur);
    return texte + " " + (Math.abs(valeur) < 2 ? singulier : pluriel);
  };
  if (n >= 1e9) return echelle(n/1e9, t.milliards, t.milliard);
  if (n >= 1e6) return echelle(n/1e6, t.millions, t.million);
  return nf(0).format(Math.round(n));
}

function duree(secondes){
  const t = T();
  const min = secondes/60, h = min/60, j = h/24, ans = j/365.25;
  if (ans >= 1e6) return grandNombre(ans) + " " + t.anMillions;
  if (ans >= 2)   return grandNombre(ans) + " " + t.ansPluriel;
  if (j >= 2)     return nf(0).format(Math.round(j)) + " " + t.jours;
  if (h >= 2)     return nf(0).format(Math.round(h)) + " " + t.heures;
  if (min >= 2)   return nf(0).format(Math.round(min)) + " " + t.minutes;
  return nf(0).format(Math.round(secondes)) + " " + t.secondes;
}

function ancrage(ans){
  const t = T();
  const debut = ANNEE - ans;
  const quand = debut < 0 ? t.avantJC(grandNombre(Math.abs(debut))) : t.apresJC(Math.round(debut));
  const a = t.ancres.find(x => ans >= x.min);
  return t.ancrage(quand, a ? a.txt : "");
}

/* ============================================================
   4. AFFICHAGE
   ============================================================ */
let chrono = null;

function habiller(){
  const t = T();
  document.documentElement.lang = t.htmlLang;
  document.title = t.titre;
  $("langue").textContent = t.autreLangue;
  $("eyebrow").textContent = t.eyebrow;
  $("titre").innerHTML = t.titre + '<span class="point">.</span>';
  $("soustitre").textContent = t.soustitre;
  $("lblSalaire").textContent = t.lblSalaire;
  $("lblSujet").textContent = t.lblSujet;
  $("h2Constat").textContent = t.h2Constat;
  $("h2Echelle").textContent = t.h2Echelle;
  $("h2Greffe").textContent = t.h2Greffe;
  $("greffeIntro").textContent = t.greffeIntro;
  $("greffeGlose").textContent = t.greffeGlose;
  $("srcTitre").textContent = t.srcTitre;
  $("copier").textContent = t.copier;
  $("pied").innerHTML = t.pied(TAUX_USD_EUR);

  const p = $("periode");
  p.options[0].textContent = t.perMois;
  p.options[1].textContent = t.perSemaine;
  p.options[2].textContent = t.perAn;

  // Menu : noms de famille seulement
  const s = $("sujet"), choix = s.value;
  s.innerHTML = "";
  SUJETS.forEach(x => {
    const o = document.createElement("option");
    o.value = x.id;
    o.textContent = x.famille;
    s.appendChild(o);
  });
  s.value = choix || "bezos";

  // Les montants vivent ici, en petit, avec leur source
  const ul = $("srcListe");
  ul.innerHTML = "";
  SUJETS.forEach(x => {
    const li = document.createElement("li");
    li.textContent = `${x.nom} — ${nf(0).format(Math.round(x.usd*TAUX_USD_EUR/1e9))} ${t.mdAbrege} (${x.releve})`;
    ul.appendChild(li);
  });
}

function calculer(){
  const t = T();
  const montant = parseFloat($("salaire").value);
  if (!montant || montant <= 0){ $("verdict").classList.remove("ouvert"); return; }

  let parMois = montant;
  if ($("periode").value === "semaine") parMois = montant * SEMAINES_PAR_MOIS;
  if ($("periode").value === "an") parMois = montant / 12;

  const sujet = SUJETS.find(x => x.id === $("sujet").value);
  const fortune = sujet.usd * TAUX_USD_EUR;
  const nb = fortune / parMois;          // ratio brut, sans unité
  const ansPile = nb / 12;

  $("constatAnnees").innerHTML = t.annees(duree(ansPile * SECONDES_PAR_AN));
  $("constatVies").innerHTML = t.vies(grandNombre(ansPile / CARRIERE));
  $("ancrage").textContent = ancrage(ansPile);

  const S_MOIS = SECONDES_PAR_AN/12;
  const cadences = [
    nb * S_MOIS, nb * 7*86400, nb * 86400,
    nb * 3600,   nb * 60,      nb,
  ];
  const ul = $("echelle");
  ul.innerHTML = "";
  cadences.forEach((sec, i) => {
    const li = document.createElement("li");
    if (i === cadences.length - 1) li.className = "ultime";
    li.innerHTML = `<span class="cadence">${t.cadences[i]}</span><span class="duree">${duree(sec)}</span>`;
    ul.appendChild(li);
  });

  // Compteur en direct, basé sur la fortune affichée elle-même :
  // « s'il avait gagné cette fortune en un an, ça ferait X par seconde »
  const parSeconde = fortune / SECONDES_PAR_AN;
  if (chrono) clearInterval(chrono);
  const t0 = Date.now();
  const tic = () => {
    $("greffe").textContent = nf(0).format(Math.round((Date.now()-t0)/1000 * parSeconde)) + " €";
  };
  tic();
  chrono = setInterval(tic, 250);

  $("verdict").classList.add("ouvert");
}

/* ============================================================
   5. BRANCHEMENTS
   ============================================================ */
$("langue").addEventListener("click", () => {
  langue = (langue === "fr") ? "en" : "fr";
  habiller();
  calculer();
});

["salaire","periode","sujet"].forEach(id => $(id).addEventListener("input", calculer));

$("copier").addEventListener("click", async () => {
  const t = T();
  const sujet = SUJETS.find(x => x.id === $("sujet").value);
  const lignes = [...$("echelle").querySelectorAll("li")]
    .map(li => li.querySelector(".cadence").textContent + " " + li.querySelector(".duree").textContent);
  const texte = `${t.titre} — ${sujet.nom}\n\n` +
                lignes.join("\n") + `\n\n${$("ancrage").textContent}`;
  try {
    await navigator.clipboard.writeText(texte);
    $("copier").textContent = t.copie;
    setTimeout(() => { $("copier").textContent = t.copier; }, 2000);
  } catch (e) {
    $("copier").textContent = "—";
    setTimeout(() => { $("copier").textContent = t.copier; }, 2000);
  }
});

habiller();
$("sujet").value = "bezos";
calculer();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
